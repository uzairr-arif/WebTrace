packages:
  - apps/*
  - packages/*
  - tests/*

# Build-script policy (pnpm 11 security default):
#   true  → the dependency's install script runs
#   false → explicitly skipped (no error, no execution)
allowBuilds:
  esbuild: true
  wxt: true
  # spawn-sync is a legacy child_process polyfill; its postinstall check is
  # unnecessary on any Node ≥ 12.
  spawn-sync: false
  # Playwright's postinstall bulk-downloads every browser — CI installs
  # Chromium explicitly instead (see .github/workflows/ci.yml).
  playwright: false

# @vitejs/plugin-react v6 peers on Vite 8; WXT 0.20 currently targets Vite ≤7.
# The security overrides force patched versions of transitive dev-dependencies
# flagged by Dependabot (they are pulled in by the WXT toolchain, not by
# WebTrace code):
#   shell-quote  <1.11   quote() command injection (critical) + parse() DoS
#   adm-zip      <0.6    zip-bomb DoS + symlink overwrite
#   tmp          <0.2.7  path traversal via unsanitized prefix/postfix
#   uuid         <14     missing buffer bounds check in v3/v5/v6
#   node-forge   <=1.4.0 PKCS#1 signature bypass + Forge DoS collection (web-ext-run)
#   source-map-js <1.2.2 event-loop DoS (tailwind/wxt chains)
#   zod          <4.6.6  memory exhaustion while validating oversized input
#   minimatch    <11.0.1 DoS (multimatch/web-ext-run chain)
#   esbuild      >=0.27.3 <0.28.1 dev-server file read on Windows (unplugin chain)
#   vite         <=7.3.6 launch-editor fs.existsSync DoS + fs.allow bypass
overrides:
  '@vitejs/plugin-react': ^4.7.0
  vite: ^7.3.7
  esbuild: ^0.28.2
  shell-quote: ^1.12.0
  node-forge: ^1.4.2
  source-map-js: ^1.2.2
  zod: ^4.6.7
  minimatch: ^11.0.3
  adm-zip: ^0.6.1
  tmp: ^0.2.7
  uuid: ^14.0.2
